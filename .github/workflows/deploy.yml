name: Производственное развертывание (Production Deploy )

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy-to-vps:
    name: Синхронизация кода с веб-сервером
    runs-on: [self-hosted, linux, x64, production]

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Проверка рабочего пространства агента
        run: |
          echo "Идентификатор коммита: ${{ github.sha }}"
          node --version
          pnpm --version

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Сборка проекта
        run: pnpm build

      - name: Синхронизация файлов
        run: |
          rsync -avz --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='README.md' \
            --exclude='.env' \
            --exclude='node_modules/' \
            ${{ github.workspace }}/ /var/www/gatchina_zakroma/
          echo "Файлы успешно перенесены в /var/www/gatchina_zakroma/"

      - name: Перезапуск приложения
        run: |
          sudo /usr/bin/pm2 restart gatchina-zakroma || sudo /usr/bin/pm2 start /var/www/gatchina_zakroma/dist/index.js --name gatchina-zakroma
          sudo systemctl restart nginx.service
